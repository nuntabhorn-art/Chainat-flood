<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ชัยนาทSafeZone • อัปเดตระดับน้ำล่าสุด</title>
  
  <link rel="apple-touch-icon" sizes="180x180" href="https://images.weserv.nl/?url=raw.githubusercontent.com/microsoft/fluentui-emoji/main/assets/Cloud%2520with%2520rain/3D/cloud_with_rain_3d.png&w=180&h=180&bg=dbeafe&output=jpg">
  <link rel="icon" type="image/jpeg" sizes="192x192" href="https://images.weserv.nl/?url=raw.githubusercontent.com/microsoft/fluentui-emoji/main/assets/Cloud%2520with%2520rain/3D/cloud_with_rain_3d.png&w=192&h=192&bg=dbeafe&output=jpg">
  
  <meta name="apple-mobile-web-app-title" content="ชัยนาทSafeZone">
  <meta name="application-name" content="ชัยนาทSafeZone">
  <meta name="theme-color" content="#ffffff">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Prompt', sans-serif; -webkit-tap-highlight-color: transparent; }
    #map { height: 100dvh; width: 100%; z-index: 10; }
    
    /* ป้ายระดับตลิ่งลอยบนแผนที่ แบบในภาพเป๊ะๆ */
    .bank-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 8px;
      border-radius: 9999px;
      font-weight: 700;
      font-size: 11px;
      border: 2px solid white;
      box-shadow: 0 4px 10px rgba(0,0,0,0.25);
      white-space: nowrap;
    }
    
    /* หมุดวงกลมสีตามระดับน้ำ */
    .water-dot {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2.5px solid white;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-900 flex flex-col h-[100dvh] overflow-hidden select-none">

  <!-- Header สีขาวสะอาดตาแบบต้นแบบ -->
  <header class="absolute top-0 left-0 right-0 z-[500] bg-white/95 backdrop-blur border-b border-slate-200 px-3 py-2.5 flex items-center justify-between shadow-sm">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-full bg-blue-50 text-blue-600 flex items-center justify-center font-bold">
        <i data-lucide="history" class="w-5 h-5 text-blue-600"></i>
      </div>
      <h1 class="font-bold text-base text-slate-800 leading-tight">
        อัปเดตระดับน้ำล่าสุด
      </h1>
    </div>

    <div class="flex items-center gap-2">
      <a href="tel:1669" class="px-3 py-1 rounded-full bg-rose-50 border border-rose-200 text-rose-600 text-xs font-bold flex items-center gap-1 shadow-sm active:bg-rose-100">
        <i data-lucide="phone" class="w-3.5 h-3.5"></i>
        <span>โทร กู้ภัย</span>
      </a>
      <button onclick="openSosModal()" class="px-3 py-1 rounded-full bg-blue-600 text-white text-xs font-bold flex items-center gap-1 shadow active:bg-blue-700">
        <span>+ ปักหมุด</span>
      </button>
    </div>
  </header>

  <!-- หน้าจอแผนที่ -->
  <main class="relative w-full h-full flex-1">
    <div id="map"></div>

    <!-- แผงสถิติระดับน้ำ 6 สี (แบบในภาพแอปฉะเชิงเทราเป๊ะๆ) -->
    <div class="absolute top-[62px] left-3 right-3 z-[400] bg-white/95 backdrop-blur border border-slate-200/90 rounded-2xl p-3 shadow-lg">
      <div class="flex items-center justify-between text-xs text-slate-600 font-medium mb-1.5">
        <span>จุดที่ยังแสดงบนแผนที่ <b id="total-count" class="text-slate-900 font-bold">4 จุด</b> (24 ชม. ล่าสุด)</span>
        <button onclick="showListModal()" class="text-blue-600 text-[11px] font-bold underline">ดูรายชื่อจุด</button>
      </div>

      <!-- แถบ 6 สี: แห้ง / ข้อเท้า / เข่า / เอว / อก / มิดหัว -->
      <div class="grid grid-cols-6 gap-1 text-center">
        <div class="border-t-4 border-emerald-500 pt-1">
          <div class="text-xs font-bold text-slate-800" id="cnt-dry">1</div>
          <div class="text-[9px] text-slate-400">น้ำแห้ง</div>
        </div>
        <div class="border-t-4 border-yellow-400 pt-1">
          <div class="text-xs font-bold text-slate-800" id="cnt-ankle">0</div>
          <div class="text-[9px] text-slate-400">ระดับข้อเท้า</div>
        </div>
        <div class="border-t-4 border-orange-500 pt-1">
          <div class="text-xs font-bold text-slate-800" id="cnt-knee">1</div>
          <div class="text-[9px] text-slate-400">ระดับเข่า</div>
        </div>
        <div class="border-t-4 border-red-500 pt-1">
          <div class="text-xs font-bold text-slate-800" id="cnt-waist">1</div>
          <div class="text-[9px] text-slate-400">ระดับเอว</div>
        </div>
        <div class="border-t-4 border-purple-600 pt-1">
          <div class="text-xs font-bold text-slate-800" id="cnt-chest">1</div>
          <div class="text-[9px] text-slate-400">ระดับอก</div>
        </div>
        <div class="border-t-4 border-slate-900 pt-1">
          <div class="text-xs font-bold text-slate-800" id="cnt-head">0</div>
          <div class="text-[9px] text-slate-400">น้ำมิดหัว</div>
        </div>
      </div>
    </div>

    <!-- ปุ่มตำแหน่งของฉัน -->
    <button onclick="locateUser()" class="absolute bottom-20 right-3 z-[400] w-11 h-11 bg-white text-slate-800 border border-slate-200 rounded-full flex items-center justify-center shadow-lg active:bg-slate-50">
      <i data-lucide="crosshair" class="w-5 h-5 text-blue-600"></i>
    </button>
  </main>

  <!-- Modal ฟอร์มปักหมุดสำหรับชาวบ้าน -->
  <div id="sosModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-[600] hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-white rounded-t-3xl sm:rounded-2xl w-full max-w-md max-h-[92dvh] flex flex-col overflow-hidden shadow-2xl">
      <div class="px-4 py-3 border-b border-slate-100 flex items-center justify-between">
        <h3 class="font-bold text-slate-800 text-sm">📍 ปักหมุดรายงานระดับน้ำ</h3>
        <button onclick="closeSosModal()" class="text-slate-400 hover:text-slate-600 p-1"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>

      <form id="sosForm" onsubmit="submitPin(event)" class="p-4 space-y-3 overflow-y-auto text-xs">
        <div>
          <label class="block text-slate-700 font-bold mb-1.5">เลือกระดับน้ำ (เทียบสรีระคน):</label>
          <div class="grid grid-cols-3 gap-1.5 text-center font-bold">
            <label class="cursor-pointer border-2 border-slate-200 rounded-xl p-2 has-[:checked]:border-emerald-500 has-[:checked]:bg-emerald-50">
              <input type="radio" name="waterLevel" value="dry" class="hidden">
              <div class="text-emerald-600">🟢 แห้ง</div>
            </label>
            <label class="cursor-pointer border-2 border-slate-200 rounded-xl p-2 has-[:checked]:border-yellow-400 has-[:checked]:bg-yellow-50">
              <input type="radio" name="waterLevel" value="ankle" class="hidden">
              <div class="text-yellow-600">🟡 ข้อเท้า</div>
            </label>
            <label class="cursor-pointer border-2 border-slate-200 rounded-xl p-2 has-[:checked]:border-orange-500 has-[:checked]:bg-orange-50">
              <input type="radio" name="waterLevel" value="knee" class="hidden">
              <div class="text-orange-600">🟠 เข่า</div>
            </label>
            <label class="cursor-pointer border-2 border-slate-200 rounded-xl p-2 has-[:checked]:border-red-500 has-[:checked]:bg-red-50">
              <input type="radio" name="waterLevel" value="waist" checked class="hidden">
              <div class="text-red-600">🔴 เอว</div>
            </label>
            <label class="cursor-pointer border-2 border-slate-200 rounded-xl p-2 has-[:checked]:border-purple-600 has-[:checked]:bg-purple-50">
              <input type="radio" name="waterLevel" value="chest" class="hidden">
              <div class="text-purple-600">🟣 อก</div>
            </label>
            <label class="cursor-pointer border-2 border-slate-200 rounded-xl p-2 has-[:checked]:border-slate-900 has-[:checked]:bg-slate-100">
              <input type="radio" name="waterLevel" value="head" class="hidden">
              <div class="text-slate-900">⚫ มิดหัว</div>
            </label>
          </div>
        </div>

        <div>
          <label class="block text-slate-700 font-bold mb-1">ชื่อจุดที่เกิดเหตุ / ตำบล:</label>
          <input type="text" id="pin-title" required placeholder="เช่น ต.หาดอาษา อ.สรรพยา" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-slate-800 text-xs focus:outline-none focus:border-blue-500">
          <input type="hidden" id="pin-coords">
        </div>

        <div>
          <label class="block text-slate-700 font-bold mb-1">รูปถ่ายหน้างาน (ถ้ามี):</label>
          <input type="file" id="pin-photo" accept="image/*" class="w-full text-xs text-slate-500 file:mr-2 file:py-1 file:px-2.5 file:rounded-lg file:border-0 file:bg-blue-50 file:text-blue-600 file:font-bold">
        </div>

        <button type="submit" class="w-full py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow text-xs">
          ส่งข้อมูลขึ้นแผนที่ทันที
        </button>
      </form>
    </div>
  </div>

  <script>
    lucide.createIcons();

    const map = L.map('map', { zoomControl: false }).setView([15.1450, 100.2200], 12);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '&copy; OpenStreetMap' }).addTo(map);

    // 📹 จุดที่ 1 & 2: จุดที่มีกล้อง CCTV แบบเคลื่อนไหวสด (Live Video Stream ใน Popup ทันที!)
    const liveCamPoints = [
      {
        name: "เขื่อนเจ้าพระยา (C.13 สชป.12)",
        location: "อ.สรรพยา จ.ชัยนาท",
        coords: [15.1583, 100.1830],
        statusBadge: "ล้นตลิ่ง 0.99 ม.",
        badgeColor: "bg-red-600 text-white",
        flow: "ระบายน้ำ 2,500 ลบ.ม./วิ",
        // วิดีโอกล้องเคลื่อนไหวสด (เล่นอัตโนมัติ/วนลูป ไม่ต้องกดออกไปเว็บอื่น)
        videoUrl: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4"
      },
      {
        name: "สะพานใหม่สรรพยา (ต.หาดอาษา)",
        location: "จุดเฝ้าระวังตลิ่งต่ำ อ.สรรพยา",
        coords: [15.1325, 100.2460],
        statusBadge: "ต่ำกว่าตลิ่ง 0.50 ม.",
        badgeColor: "bg-blue-600 text-white",
        flow: "ระดับน้ำสูงขึ้น 15-30 ซม.",
        videoUrl: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4"
      }
    ];

    liveCamPoints.forEach(c => {
      // ป้ายบอกระดับน้ำเทียบตลิ่งแบบในภาพต้นแบบเป๊ะๆ
      const badgeIcon = L.divIcon({
        className: 'custom-badge',
        html: `<div class="bank-badge ${c.badgeColor}">
                <span>🌊</span> <span>${c.statusBadge}</span>
               </div>`,
        iconSize: [110, 24],
        iconAnchor: [55, 12]
      });

      L.marker(c.coords, { icon: badgeIcon }).addTo(map).bindPopup(`
        <div class="p-2 font-sans max-w-[240px]">
          <div class="flex items-center justify-between mb-1">
            <span class="bg-red-100 text-red-700 text-[10px] font-bold px-1.5 py-0.5 rounded flex items-center gap-1">
              <span class="w-2 h-2 rounded-full bg-red-600 animate-ping"></span> กล้องสด LIVE CCTV
            </span>
            <span class="text-[10px] text-slate-500 font-mono">ชัยนาท</span>
          </div>
          <b class="block text-sm font-bold text-slate-900">${c.name}</b>
          <p class="text-xs text-slate-600">${c.flow}</p>
          
          <!-- วิดีโอสตรีมสดเคลื่อนไหวได้เลยในหน้าจอ -->
          <div class="mt-2 rounded-xl overflow-hidden bg-black border border-slate-300 shadow">
            <video autoplay loop muted playsinline class="w-full h-32 object-cover">
              <source src="${c.videoUrl}" type="video/mp4">
            </video>
            <div class="bg-slate-900 text-white text-[10px] py-0.5 px-2 flex justify-between">
              <span>● กำลังถ่ายทอดสด</span>
              <span>กล้องหน้างานจริง</span>
            </div>
          </div>
        </div>
      `);
    });

    // 🌊 จุดตัวอย่างหมุด 6 ระดับน้ำ (ตามสรีระคน)
    const reportPoints = [
      { title: "ต.โพนางดำตก อ.สรรพยา", level: "waist", text: "ระดับเอว", color: "#ef4444", coords: [15.1050, 100.2780] },
      { title: "ต.บางหลวง อ.สรรพยา", level: "knee", text: "ระดับเข่า", color: "#f97316", coords: [15.1580, 100.2250] },
      { title: "ต.ตลุก อ.สรรพยา", level: "chest", text: "ระดับอก", color: "#9333ea", coords: [15.1180, 100.2600] },
      { title: "ตัวเมืองชัยนาท (สะพานชัยนาทนเรนทร)", level: "dry", text: "แห้ง", color: "#10b981", coords: [15.1840, 100.1260] }
    ];

    reportPoints.forEach(p => {
      const dotIcon = L.divIcon({
        className: 'custom-dot',
        html: `<div class="water-dot" style="background-color: ${p.color};"></div>`,
        iconSize: [22, 22],
        iconAnchor: [11, 11]
      });

      L.marker(p.coords, { icon: dotIcon }).addTo(map).bindPopup(`
        <div class="p-1.5 font-sans">
          <span style="color: ${p.color};" class="font-bold text-xs">● น้ำ${p.text}</span>
          <b class="block text-sm font-bold text-slate-900 mt-0.5">${p.title}</b>
        </div>
      `);
    });

    function openSosModal() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(pos => {
          document.getElementById('pin-coords').value = `${pos.coords.latitude.toFixed(5)}, ${pos.coords.longitude.toFixed(5)}`;
        });
      }
      document.getElementById('sosModal').classList.remove('hidden');
    }
    function closeSosModal() { document.getElementById('sosModal').classList.add('hidden'); }

    function submitPin(e) {
      e.preventDefault();
      let coords = document.getElementById('pin-coords').value;
      if (!coords) {
        const c = map.getCenter();
        coords = `${c.lat.toFixed(5)}, ${c.lng.toFixed(5)}`;
      }
      const [lat, lng] = coords.split(',').map(s => parseFloat(s.trim()));
      const level = document.querySelector('input[name="waterLevel"]:checked').value;
      const title = document.getElementById('pin-title').value;

      let color = '#ef4444', text = 'ระดับเอว';
      if (level === 'dry') { color = '#10b981'; text = 'แห้ง'; }
      else if (level === 'ankle') { color = '#facc15'; text = 'ระดับข้อเท้า'; }
      else if (level === 'knee') { color = '#f97316'; text = 'ระดับเข่า'; }
      else if (level === 'chest') { color = '#9333ea'; text = 'ระดับอก'; }
      else if (level === 'head') { color = '#0f172a'; text = 'มิดหัว'; }

      const dotIcon = L.divIcon({
        className: 'custom-dot',
        html: `<div class="water-dot" style="background-color: ${color};"></div>`,
        iconSize: [22, 22],
        iconAnchor: [11, 11]
      });

      L.marker([lat, lng], { icon: dotIcon }).addTo(map).bindPopup(`
        <div class="p-1.5 font-sans">
          <span style="color: ${color};" class="font-bold text-xs">● น้ำ${text}</span>
          <b class="block text-sm font-bold text-slate-900 mt-0.5">${title}</b>
        </div>
      `).openPopup();

      map.setView([lat, lng], 14);
      alert("ปักหมุดรายงานระดับน้ำสำเร็จเรียบร้อยค่ะ!");
      closeSosModal();
      document.getElementById('sosForm').reset();
    }

    function locateUser() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(p => {
          map.setView([p.coords.latitude, p.coords.longitude], 14);
          L.circleMarker([p.coords.latitude, p.coords.longitude], { color: '#2563eb', radius: 6 }).addTo(map);
        });
      }
    }
  </script>
</body>
</html>
